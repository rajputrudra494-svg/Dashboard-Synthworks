<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="description" content="SynthWorks clients — the shared CRM for every account the studio works with.">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex">

  <title>SynthWorks · Clients</title>

  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <script src="theme-init.js"></script>

  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="sidebar.css">
  <link rel="stylesheet" href="cards.css">
  <link rel="stylesheet" href="tables.css">
  <link rel="stylesheet" href="forms.css">
  <link rel="stylesheet" href="charts.css">
  <link rel="stylesheet" href="animations.css">
  <link rel="stylesheet" href="responsive.css">
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="app">
    <aside class="app-sidebar" aria-label="Primary navigation"></aside>

    <div class="app-main">
      <header class="app-topbar"></header>

      <main class="page" id="main">
        <div class="page-head">
          <div>
            <h1>Clients</h1>
            <p class="sub">Every account the studio works with — shared with the whole team.</p>
          </div>

          <div class="page-head-actions">
            <span class="realtime-pill"><i></i><span>Connecting</span></span>
            <button class="btn btn--secondary btn--sm" type="button" id="exportClients">
              <i data-lucide="download"></i> Export
            </button>
            <button class="btn btn--primary btn--sm" type="button" id="addClient">
              <i data-lucide="plus"></i> Add client
            </button>
          </div>
        </div>

        <!-- Summary tiles -->
        <section class="stat-grid stagger mb-6" id="clientStats" aria-label="Client summary"></section>

        <!-- View switch -->
        <div class="between mb-4">
          <div class="segmented" id="viewSwitch" role="group" aria-label="View mode">
            <button type="button" class="is-active" data-view="table">
              <i data-lucide="list"></i> Table
            </button>
            <button type="button" data-view="grid">
              <i data-lucide="layout-grid"></i> Cards
            </button>
          </div>
        </div>

        <!-- Table view -->
        <section id="clientTable" aria-label="Client list"></section>

        <!-- Card view -->
        <section id="clientGrid" class="grid-auto" aria-label="Client cards" hidden></section>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.10/dist/umd/supabase.js"></script>
  <script src="https://unpkg.com/lucide@0.474.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

  <script type="module" src="clients.js"></script>
</body>
</html>
